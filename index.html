<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0d722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Abfahrten</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #fff; --text: #1b1b1b; --muted: #6b6b66;
    --accent: #f0d722; --accent-text: #1b1b1b; --line: #e3e3de;
    --late: #c62828; --ok: #1b7f3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1e1e1e; --text: #f1f1ee; --muted: #9a9a94; --line: #333; --late: #ff6b6b; --ok: #5fd68a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 18px 0 12px; }
  #go {
    width: 100%; padding: 18px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-text);
    font: inherit; font-size: 1.15rem; font-weight: 700; cursor: pointer;
  }
  #go:disabled { opacity: .6; }
  #status { color: var(--muted); font-size: .9rem; margin: 10px 2px; min-height: 1.3em; }
  #status.error { color: var(--late); }
  .stop { background: var(--card); border-radius: 14px; margin: 12px 0; overflow: hidden; }
  .stop h2 { font-size: 1rem; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .stop h2 small { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .dep { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .dep:last-child { border-bottom: 0; }
  .badge { min-width: 3.1em; text-align: center; padding: 3px 6px; border-radius: 6px; color: #fff; font-weight: 700; font-size: .9rem; background: #666; }
  .badge.subway { background: #0d5fa8; }
  .badge.suburban { background: #1d8a3a; }
  .badge.tram { background: #c8102e; }
  .badge.bus { background: #9b2d8f; }
  .badge.ferry { background: #0f8fa3; }
  .badge.regional { background: #555; }
  .dir { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir small { display: block; color: var(--muted); font-size: .78rem; }
  .min { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .min small { display: block; font-weight: 400; font-size: .75rem; color: var(--ok); }
  .min small.late { color: var(--late); }
  .cancelled .dir, .cancelled .min { text-decoration: line-through; color: var(--muted); }
  .empty { padding: 14px; color: var(--muted); }
  footer { color: var(--muted); font-size: .75rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>BVG-Abfahrten in meiner Nähe</h1>
  <button id="go" type="button">Abfahrten laden</button>
  <div id="status" role="status"></div>
  <div id="result"></div>
  <footer>Daten: v6.bvg.transport.rest (VBB/BVG)</footer>
</main>
<script>
const API = 'https://v6.bvg.transport.rest';
const RADIUS = 500;      // Meter
const MAX_STOPS = 4;     // so viele Haltestellen höchstens
const MAX_DEPS = 8;      // Abfahrten je Haltestelle
const WINDOW_MIN = 40;   // Zeitfenster in Minuten

const $go = document.getElementById('go');
const $status = document.getElementById('status');
const $result = document.getElementById('result');

function setStatus(msg, isError = false) {
  $status.textContent = msg;
  $status.classList.toggle('error', isError);
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('Dieses Gerät unterstützt keine Standortabfrage.'));
    navigator.geolocation.getCurrentPosition(resolve, err => {
      const msgs = {
        1: 'Standortzugriff verweigert. Bitte in den Browser-Einstellungen erlauben.',
        2: 'Standort konnte nicht ermittelt werden.',
        3: 'Standortabfrage hat zu lange gedauert.',
      };
      reject(new Error(msgs[err.code] || 'Standortfehler.'));
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
}

async function getJson(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error('BVG-Schnittstelle antwortet nicht (' + res.status + ').');
  return res.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderStop(stop, deps) {
  const card = el('section', 'stop');
  const h = el('h2', null, stop.name.replace(/ \(Berlin\)$/, ''));
  h.appendChild(el('small', null, stop.distance + ' m'));
  card.appendChild(h);

  if (!deps.length) {
    card.appendChild(el('div', 'empty', 'Keine Abfahrten in den nächsten ' + WINDOW_MIN + ' Minuten.'));
    return card;
  }
  for (const d of deps) {
    const cancelled = d.cancelled || !d.when;
    const when = new Date(d.when || d.plannedWhen);
    const mins = Math.max(0, Math.round((when - Date.now()) / 60000));
    const row = el('div', 'dep' + (cancelled ? ' cancelled' : ''));
    row.appendChild(el('span', 'badge ' + (d.line?.product || ''), d.line?.name || '?'));

    const dir = el('div', 'dir', d.direction || '');
    if (d.platform) dir.appendChild(el('small', null, d.platform));
    row.appendChild(dir);

    const min = el('div', 'min', cancelled ? 'entfällt' : (mins === 0 ? 'jetzt' : mins + ' min'));
    if (!cancelled && d.delay != null) {
      const late = Math.round(d.delay / 60);
      if (late >= 1) min.appendChild(el('small', 'late', '+' + late));
      else min.appendChild(el('small', null, 'pünktlich'));
    }
    row.appendChild(min);
    card.appendChild(row);
  }
  return card;
}

async function load() {
  $go.disabled = true;
  $result.replaceChildren();
  try {
    setStatus('Standort wird ermittelt …');
    const pos = await getPosition();
    const { latitude, longitude } = pos.coords;

    setStatus('Suche Haltestellen …');
    const near = await getJson(`/locations/nearby?latitude=${latitude}&longitude=${longitude}` +
      `&distance=${RADIUS}&results=${MAX_STOPS}&stops=true&poi=false&addresses=false`);
    const stops = near.filter(s => s.type === 'stop');
    if (!stops.length) {
      setStatus('Keine Haltestelle im Umkreis von ' + RADIUS + ' m gefunden.');
      return;
    }

    setStatus('Lade Abfahrten …');
    const all = await Promise.all(stops.map(s =>
      getJson(`/stops/${s.id}/departures?duration=${WINDOW_MIN}&results=${MAX_DEPS}&linesOfStops=false&remarks=false`)
        .then(r => r.departures)));
    // Nahe Haltestellen gehören oft zum selben Bahnhof und liefern dieselben Fahrten:
    // jede Fahrt nur einmal zeigen, und zwar bei der nächstgelegenen Haltestelle.
    const seen = new Set();
    let shown = 0;
    stops.forEach((s, i) => {
      const deps = all[i]
        .filter(d => !seen.has(d.tripId))
        .sort((a, b) => new Date(a.when || a.plannedWhen) - new Date(b.when || b.plannedWhen))
        .slice(0, MAX_DEPS);
      deps.forEach(d => seen.add(d.tripId));
      if (deps.length || !shown) { $result.appendChild(renderStop(s, deps)); shown++; }
    });

    setStatus('Stand ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) +
      ' · Genauigkeit ±' + Math.round(pos.coords.accuracy) + ' m');
  } catch (e) {
    setStatus(e.message || 'Unbekannter Fehler.', true);
  } finally {
    $go.disabled = false;
    $go.textContent = 'Aktualisieren';
  }
}

$go.addEventListener('click', load);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
